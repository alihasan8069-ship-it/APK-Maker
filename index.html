<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Website APK Studio</title>
<link rel="stylesheet" href="web-studio.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Website <span>APK Studio</span><small>Web Edition</small></div>
  <div class="top-actions">
    <button id="newBtn">New</button><button id="saveBtn">Save</button><button id="exportBtn">Export ZIP</button>
    <button id="buildBtn" class="primary">Build APK</button>
  </div>
</header>
<main class="layout">
<aside class="sidebar">
  <section><h3>Project</h3><label>App Name</label><input id="appName" value="My Website App">
  <label>Package Name</label><input id="packageName" value="com.example.mywebsiteapp">
  <label>Version</label><input id="version" value="1.0.0"></section>
  <section><h3>Import</h3><div class="grid2"><button id="uploadBtn">Website Files</button><button id="zipBtn">ZIP Project</button></div>
  <button id="urlBtn">Import Website URL</button><div id="fileList" class="file-list">No files imported</div></section>
  <section><h3>App Identity</h3><input id="logoInput" type="file" accept="image/*" hidden><button id="logoBtn">Upload App Logo</button><div class="logo-box"><img id="logoPreview" alt=""></div><div id="logoStatus" class="hint">No logo selected.</div></section>
  <section><h3>App Opening Protection</h3><label class="check"><input type="checkbox" id="appProtection"> Password protection</label><div id="protectionOptions" class="hidden"><input id="appProtectionPassword" type="password" placeholder="Opening password"><div class="hint">Password only.</div></div></section>
  <section><h3>App Settings</h3><label>Orientation</label><select id="orientation"><option>Portrait</option><option>Landscape</option><option>Auto</option></select>
  <label class="check"><input type="checkbox" checked id="downloads"> Downloads</label><label class="check"><input type="checkbox" checked id="uploads"> File uploads</label><label class="check"><input type="checkbox" id="fullscreen"> Full screen</label></section>
  <section><h3>Native Features</h3><label class="check"><input type="checkbox" id="camera"> Camera</label><label class="check"><input type="checkbox" id="microphone"> Microphone</label><label class="check"><input type="checkbox" id="notifications"> Notifications</label><label class="check"><input type="checkbox" id="location"> Location</label></section>
  <section><h3>APK Build</h3><div class="hint">The browser editor and previews work here. Actual Android APK compilation needs the desktop/build server.</div></section>
</aside>
<section class="workspace">
  <div class="tabs"><button class="tab active" data-tab="html">HTML</button><button class="tab" data-tab="css">CSS</button><button class="tab" data-tab="js">JavaScript</button><button class="tab" data-tab="json">JSON</button></div>
  <textarea id="editor" spellcheck="false"></textarea>
  <div class="toolbar"><button id="runBtn" class="run">▶ Run</button><button id="stopBtn">■ Stop</button><button id="clearBtn">Clear</button><span id="status">Ready</span></div>
  <div class="preview-tabs"><button class="preview-tab active" data-preview="website">Website Preview</button><button class="preview-tab" data-preview="mobile">Mobile Preview</button><button class="preview-tab" data-preview="logs">Logs</button></div>
  <div class="preview-area"><div id="websitePreview" class="preview-pane"><iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></div><div id="mobilePreview" class="preview-pane hidden"><div class="phone"><div class="phone-notch"></div><iframe id="mobileFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></div></div><pre id="logs" class="preview-pane hidden"></pre></div>
</section>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="web-studio.js"></script>
</body></html>
